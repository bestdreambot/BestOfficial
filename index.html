<!-- 05.08.2026 — ПОРТ 1000→2000, Фаза 2 (проекты + участники поверх принятого твина). Фаза 1
     (клон сцены 1000: stage/canvas/word/живой facet-тор, ничего больше) — подтверждена Создателем
     («ок, похоже»). Теперь по его прямому слову — «там очень много всего, и проекты и участники,
     заполняй всё что там есть с новым дизайном» — возвращены реальные фичи bestofficial.vercel.app
     (26 проектов PROJECTS, 15 участников PARTICIPANT_CHAIN, карточка/star-page, TikTok-ссылка),
     но вторым слоем (Grok, §3.1: первый кадр остаётся тихим, nav-кнопки проявляются с задержкой),
     и в новом материале — тор/слово те же, что в Фазе 1, не старый flash/streak/CSS-пульт. Данные
     (js/data-*.js) — родные, без изменений. Движок — js/best-app.js, не embedded-скрипт канона:
     цвет тора обобщён на ЛЮБУЮ из ~40 палитр WORLDS (не только gold), один переход-почерк
     (dissolve + facet-ignite) вместо старых пяти ring-режимов — сознательное упрощение ради
     консистентности материала, не потеря функциональности. См. память
     project_bestofficial_local_visual_port.md. Локально, порт 2000 — git/Vercel не тронуты. -->

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- 06.08.2026 — перед деплоем найдено расхождение с живым сайтом: прод умеет открываться как
     Telegram Mini App (Release 1.7/1.8 в origin: telegram-web-app.js, tg.expand(), тактильный
     отклик, openLink для TikTok, safe-area), а порт 2000 этого не умел вообще. Портируется сюда
     ДО деплоя, чтобы деплой не убрал рабочую функцию с живого сайта (см. best-app.js). -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; overflow:hidden; background:#020307; }
  body{ display:flex; align-items:center; justify-content:center; }
  .stage{
    position:relative; width:min(88vmin, 920px); aspect-ratio:1/1;
    display:flex; align-items:center; justify-content:center;
    container-type: inline-size;
  }
  /* 08.08.2026, Создатель: «зажги главный тор, дай ему мощи, попробуем варианты» — Вариант 1
     (сильнее halo + двойной drop-shadow) не подошёл: «смотри внимательно на порт 1000, там идеал,
     вот как было». Порт 1000 (freexofficial.html, корень, канон) — тот же halo/drop-shadow/breathe
     один в один, только синий тон вместо золотого. Значит сама структура/сила свечения — это и есть
     эталон, менять её не нужно; вернул исходные значения BestOfficial (только золотой тон — то, чем
     он и отличается от канона по праву). Поиск светового усиления продолжается другим путём, не
     через интенсивность этого фильтра — см. «Процесс» → «поиск лучшего светового элемента». */
  .stage::before{
    content:""; position:absolute; inset:12%; border-radius:50%;
    background:radial-gradient(circle, transparent 30%, rgba(255,224,150,.10) 52%, rgba(255,200,120,.055) 63%, transparent 74%);
    filter:blur(18px); animation:breathe 9.5s ease-in-out infinite;
  }
  #tor{ position:absolute; inset:0; width:100%; height:100%; filter:drop-shadow(0 0 12px rgba(255,214,140,.28)); }
  @keyframes breathe{ 50%{ transform:scale(1.035); opacity:.78; } }
  @media (prefers-reduced-motion: reduce){ .stage::before{ animation:none; } }

  .word{
    position:relative; z-index:2; text-align:center;
    user-select:none; cursor:pointer;
    opacity:0; animation: wordIn 1.6s cubic-bezier(.16,.9,.25,1) .3s forwards;
  }
  .word:focus-visible{ outline:2px solid rgba(255,222,140,.85); outline-offset:10px; border-radius:8px; }
  .word .fo{
    display:block;
    font-family:"Orbitron", "Cinzel", Georgia, "Times New Roman", serif;
    font-weight:900; line-height:1.05; letter-spacing:0.015em;
    font-size: clamp(1.4rem, 9.2vmin, 6.3rem);
    font-size: clamp(1.4rem, 10cqi, 8rem);
    white-space:nowrap;
    -webkit-text-stroke: 1px rgba(10,12,15,.6);
    background:
      radial-gradient(ellipse 24% 12% at 26% 23%, rgba(255,250,225,.32) 0%, rgba(255,250,225,0) 72%),
      linear-gradient(115deg, transparent 44%, rgba(255,244,210,.6) 49.6%, rgba(255,244,210,.6) 50.4%, transparent 56%),
      linear-gradient(100deg, transparent 32%, rgba(255,209,102,.16) 43%, rgba(255,253,243,.22) 50%, rgba(255,243,196,.16) 57%, transparent 68%),
      repeating-linear-gradient(125deg, rgba(255,255,255,.22) 0 5%, rgba(20,20,26,.20) 5% 10%, rgba(255,255,255,.10) 10% 14%),
      repeating-linear-gradient(35deg, rgba(255,255,255,.16) 0 8%, rgba(0,0,0,.16) 8% 16%),
      linear-gradient(160deg,
        #4a3208 0%, #96701a 14%, #3d2a08 26%, #b8912c 36%,
        #cfa646 45%, #fff6d6 48%, #cfa646 51%,
        #b8912c 60%, #3d2a08 72%, #96701a 86%, #4a3208 100%);
    background-size: 100% 100%, 260% 100%, 340% 100%, 100% 100%, 100% 100%, 200% 100%;
    background-position: 0 0, 220% 0, 80% 0, 0 0, 0 0, 0% 50%;
    background-blend-mode: normal, normal, normal, soft-light, soft-light, normal;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter:
      contrast(1.18) saturate(.24)
      drop-shadow(-1px -1px 0.5px rgba(255,255,255,.5))
      drop-shadow(2px 3px 0 rgba(0,0,0,.5))
      drop-shadow(3px 6px 5px rgba(0,0,0,.4))
      drop-shadow(0 0 10px rgba(200,220,255,.12));
    animation: shimmer 17s ease-in-out infinite;
  }
  .fo-over{ position:absolute; top:0; left:0; width:100%; opacity:0; pointer-events:none; }
  @keyframes shimmer{
    0%{ background-position: 0 0, 220% 0, 80% 0, 0 0, 0 0, 0% 50%; }
    35%{ background-position: 0 0, 220% 0, 80% 0, 0 0, 0 0, 55% 50%; }
    50%{ background-position: 0 0, 70% 0, 25% 0, 0 0, 0 0, 100% 50%; }
    65%{ background-position: 0 0, -80% 0, -30% 0, 0 0, 0 0, 55% 50%; }
    100%{ background-position: 0 0, -80% 0, -30% 0, 0 0, 0 0, 0% 50%; }
  }
  @keyframes wordIn{ from{ opacity:0; transform:translateY(10px) scale(.97); } to{ opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce){
    .word{ opacity:1; animation:none; }
    .word .fo{ animation:none; }
  }

  /* Фаза 2 (05.08.2026) — проекты/участники поверх твина, тот же материал (тёмный космос + золото),
     не старый CSS-пульт. Ссылка/кнопки/карточка проявляются с задержкой (см. best-app.js) — первый
     кадр остаётся тихим. */
  .tiktok-link{
    position:fixed; left:50%; top:calc(50% + 20vmin); transform:translateX(-50%);
    z-index:4; display:inline-flex; align-items:center; justify-content:center;
    min-height:30px; padding:2px 10px;
    opacity:0; pointer-events:none; transition:opacity 0.6s ease, color 0.25s ease;
    font-family:"Cinzel", Georgia, "Times New Roman", serif;
    font-size: clamp(12px, 1.6vmin, 15px); letter-spacing:0.16em; text-transform:uppercase; font-weight:600;
    color: rgba(224,204,164,0.78); text-decoration:none; white-space:nowrap;
  }
  .tiktok-link.show{ opacity:1; pointer-events:auto; }
  .tiktok-link:hover, .tiktok-link:focus-visible{ color:rgba(244,226,186,0.98); }
  @media (prefers-reduced-motion: reduce){ .tiktok-link{ transition:none; opacity:1; pointer-events:auto; } }

  /* 08.08.2026, Создатель: «прям под тор 2 кликабельные надписи — релиз 4, версия 1» — статус
     всего проекта целиком (не одного слова/проекта в цепочке), поэтому видно всегда, не только на
     шаге Best, и не прячется вместе с mktor/tiktok-ссылкой. */
  /* 08.08.2026, Создатель: «нужно ниже, чтобы не касались тора» — тор (.stage) сам по себе квадрат
     min(88vmin,920px), значит его нижний край — center + min(44vmin,460px). Кладём полосу за этим
     краем + отступ, но не ниже видимой области.
     08.08.2026, снова рядом: «релиз по середине, версия справа от релиза» — «Релиз» стоит на
     оси 50% сам по себе (left:50%, translateX(-50%)) — его позиция ничем не зависит от «Версии».
     «Версия» стартует своим ЛЕВЫМ краем на фиксированном отступе от центра (translateX(0), не
     -50%), поэтому не может наехать на «Релиз» независимо от длины текста той или другой надписи.
     Версия — только локально (см. JS, скрывается на публичном хосте). */
  .release-label{
    position:fixed; top:min(calc(50% + min(44vmin, 460px) + 22px), calc(100% - 42px));
    z-index:5; opacity:0; animation: wordIn 1.6s cubic-bezier(.16,.9,.25,1) .9s forwards;
    font-family:"Cinzel", Georgia, "Times New Roman", serif;
    font-size:clamp(10px, 1.3vmin, 12px); letter-spacing:.14em; text-transform:uppercase; font-weight:600;
    color:rgba(224,204,164,.7); cursor:pointer; padding:3px 11px;
    border:1px solid rgba(255,214,140,.2); border-radius:100px;
    transition:color .2s ease, border-color .2s ease, background .2s ease;
  }
  /* 08.08.2026: лёгкая ручная поправка влево — letter-spacing/паддинг у текста визуально «тянут»
     центр надписи чуть вправо от геометрического центра рамки, эта правка компенсирует именно
     оптику, не меняя позицию «Версии». */
  #releaseLabel{ left:calc(50% - 38px); transform:translateX(-50%); }
  #versionLabel{ left:calc(50% + 70px); transform:translateX(0); opacity:.6; }
  .release-label:hover, .release-label:focus-visible{ color:#ffd558; border-color:rgba(255,213,88,.45); background:rgba(255,213,88,.06); }
  @media (prefers-reduced-motion: reduce){ .release-label{ animation:none; opacity:1; } #versionLabel{ opacity:.6; } }
  .release-group{ margin:14px 0 0; text-align:left; }
  .release-group:first-of-type{ margin-top:4px; }
  .release-group-title{
    font-family:"Cinzel", serif; font-size:11px; letter-spacing:.08em; text-transform:uppercase;
    display:flex; align-items:center; gap:7px; margin-bottom:6px; color:rgba(230,220,200,.75);
  }
  .release-item{ margin:5px 0; font-family:Georgia, serif; font-size:13px; line-height:1.4; color:rgba(230,220,200,.85); padding-left:17px; }
  .release-note{ font-family:Georgia, serif; font-size:13px; line-height:1.5; color:rgba(230,220,200,.85); text-align:center; }

  /* 05.08.2026, повторный аудит Grok (ai/GROK.md § «повторный аудит 2000 · mktor вернуть»):
     предыдущий заход («самоцвет»-кружок вместо canvas-мини-тора) исполнил прошлый совет Grok
     СЛИШКОМ буквально — тот был планом B на случай "не получится красиво", а не запретом на мини-
     тор как сущность. Создатель прямо сказал: кружки — не то, верните настоящие младшие торы
     (mktor = FOM2 из BestOfficial.git, тем же материалом, что порт 1000). Вернул: canvas-кольцо
     (не диск), тот же гранёный+пылевой почерк, что у главного тора (упрощённый — меньше сегментов/
     частиц), подпись — absolute по центру ВНУТРИ кольца (не под ним), LEFT перекрашивается в цвет
     текущего мира/звезды, RIGHT — всегда золото Best. Рисуется в одном rAF с главным тором
     (drawMktor() в best-app.js — отдельная функция, главный draw-loop не трогал). */
  .nav-btn{
    position:fixed; bottom:max(18px, env(safe-area-inset-bottom)); z-index:4;
    width:min(18vmin, 120px); aspect-ratio:1/1; cursor:pointer; user-select:none;
    opacity:0; transform:translateY(8px); pointer-events:none;
    transition:opacity .7s ease, transform .7s ease;
  }
  .nav-btn.show{ opacity:1; transform:none; pointer-events:auto; }
  .nav-btn-left{ left:max(14px, env(safe-area-inset-left)); }
  .nav-btn-right{ right:max(14px, env(safe-area-inset-right)); }
  /* Lunora (06.08.2026) — сверху слева, не снизу: третий mktor, вне линейной LEFT/RIGHT логики. */
  .nav-btn-top-left{
    bottom:auto; top:max(18px, env(safe-area-inset-top));
    left:max(14px, env(safe-area-inset-left));
    width:min(13vmin, 84px);
  }
  .nav-canvas{
    position:absolute; inset:0; width:100%; height:100%; border-radius:50%;
    filter:drop-shadow(0 0 10px rgba(255,214,140,.22));
    transition:filter .25s ease;
  }
  .nav-btn:hover .nav-canvas, .nav-btn:focus-visible .nav-canvas, .nav-btn.active .nav-canvas{
    filter:drop-shadow(0 0 16px rgba(255,214,140,.4));
  }
  /* 06.08.2026 — «шрифт в mktor такой же, как в Кторе, только меньше»: раньше подпись была плоским
     Orbitron 700 + text-shadow, теперь тот же металл-градиент/вес/семейство, что у главного слова
     `.fo` выше (упрощённый — без гранёной repeating-текстуры и shimmer-анимации: mktor статичный,
     а на таком мелком размере facet-шум просто мылится), тот же принцип «слово всегда золото,
     кольцо меняет цвет» (см. CLAUDE.md freex/bestofficial: «Word... gold gradient... fixed; only
     torus changes color»), применённый и к mktor. 06.08.2026 — размер чуть увеличен по просьбе
     Создателя (было clamp(8px,1.5vmin,11px), стало clamp(10px,1.9vmin,14px)). */
  .nav-label{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    text-align:center; padding:0 10%; pointer-events:none; line-height:1.05;
    font-family:"Orbitron", "Cinzel", Georgia, "Times New Roman", serif;
    font-weight:900; letter-spacing:.02em; text-transform:uppercase;
    font-size:clamp(10px, 1.9vmin, 14px); white-space:nowrap;
    -webkit-text-stroke: 0.5px rgba(10,12,15,.55);
    background:
      linear-gradient(115deg, transparent 40%, rgba(255,244,210,.65) 49%, rgba(255,244,210,.65) 51%, transparent 60%),
      linear-gradient(160deg,
        #4a3208 0%, #96701a 16%, #3d2a08 30%, #b8912c 42%,
        #cfa646 49%, #fff6d6 52%, #cfa646 55%,
        #b8912c 64%, #3d2a08 78%, #96701a 90%, #4a3208 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: contrast(1.15) saturate(.32) drop-shadow(0 1px 2px rgba(0,0,0,.85)) drop-shadow(0 0 5px rgba(0,0,0,.55));
  }
  .nav-btn:focus-visible{ outline:2px solid rgba(255,222,140,.85); outline-offset:4px; border-radius:50%; }
  @media (prefers-reduced-motion: reduce){ .nav-btn, .nav-canvas{ transition:none; } }

  /* Лицо в дыре главного Ктора (05.08.2026, Grok: «часть, которая уже получалась» в старом FO —
     фото участника по центру, как и раньше, теперь только в режиме звёзд). */
  .hole-photo{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:min(42vmin, 46%); aspect-ratio:1/1; border-radius:50%; object-fit:cover;
    z-index:2; opacity:0; pointer-events:none; transition:opacity .6s ease;
    box-shadow: 0 0 0 1px rgba(255,214,140,.35), 0 0 22px rgba(255,200,110,.28);
    -webkit-mask-image: radial-gradient(circle, #000 62%, transparent 100%);
    mask-image: radial-gradient(circle, #000 62%, transparent 100%);
  }
  .hole-photo.show{ opacity:1; pointer-events:auto; }
  .hole-photo.leader{ box-shadow: 0 0 0 1.5px rgba(255,224,160,.5), 0 0 30px rgba(255,205,120,.35); }
  @media (prefers-reduced-motion: reduce){ .hole-photo{ transition:none; } }
  /* 06.08.2026 (Создатель: «в кторе я вижу Галя, а в маленьком торе тоже написано Галя» — дубль
     имени). На эталоне (bestofficial.vercel.app) это уже было решено Создателем 01.08.2026 — «имя
     под фото убери, оно уже есть в FOM2» (js/app.js: participantNameEl.classList.remove('show')).
     Мы это решение потеряли при клоне и снова рисовали имя под фото. Возврат к эталону: слово
     прячется совсем, пока показано фото — имя видно только один раз, в mktor слева. */
  .stage.photo-mode .word{ opacity:0; visibility:hidden; pointer-events:none; }
  /* 08.08.2026, Создатель: «медиум тор — возьми Ктор и сделай в 10 раз меньше, вокруг фото Гали
     в карточке». Не отдельная копия физики частиц (дорого, дублирует систему) — слепок уже
     отрисованного главного канваса (drawImage в JS), тот же цвет/движение, просто уменьшенный, за
     фото, кольцом вокруг него. */
  .card-photo-wrap{ position:relative; width:min(38vw, 156px); aspect-ratio:1/1; margin:0 auto 12px; }
  .card-mini-torus{ position:absolute; inset:0; width:100%; height:100%; }
  .card-photo{
    position:absolute; inset:14%; width:72%; height:72%; margin:0;
    border-radius:50%; object-fit:cover;
    box-shadow: 0 0 0 1px rgba(255,214,140,.35), 0 0 18px rgba(255,200,110,.25);
  }
  /* 08.08.2026, Создатель: «в medium-тор проектов вставь название» — у проектов вместо фото в
     центре лежит само слово, тот же почерк (шрифт/градиент), что у надписи под главным тором. */
  .card-mini-torus-label{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    font-family:"Orbitron","Cinzel",Georgia,"Times New Roman",serif; font-weight:900;
    font-size:clamp(11px, 3.4vmin, 16px); letter-spacing:.02em; text-align:center;
    max-width:78%; line-height:1.1; pointer-events:none;
    color:#ffe9b8; text-shadow:0 0 6px rgba(255,214,140,.55), 0 1px 2px rgba(0,0,0,.6);
  }

  .card{ position:fixed; inset:0; z-index:6; display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .3s ease; }
  .card.open{ opacity:1; pointer-events:auto; }
  .card-backdrop{ position:absolute; inset:0; background:rgba(2,3,7,.82); backdrop-filter:blur(3px); }
  /* 08.08.2026, Создатель (срочно): «в Telegram не видно всю карточку — видно только конец
     презентации, процесс вообще не виден». Причина: .card-body росла по контенту без ограничения
     высоты и без скролла — на обычном мобильном браузере ужимается видом (viewport выше), а в
     Telegram WebView видимая область короче, и всё, что не влезло, было просто недостижимо. Теперь
     сама карточка ограничена высотой экрана и скроллится внутри себя — контент никогда не обрезан. */
  .card-body{
    position:relative; z-index:1; max-width:min(88vw, 420px); width:100%;
    max-height:calc(100vh - 40px); max-height:calc(100dvh - 40px);
    overflow-y:auto; -webkit-overflow-scrolling:touch;
    background:linear-gradient(165deg, rgba(20,16,8,.92), rgba(10,8,4,.96));
    border:1px solid rgba(255,214,140,.22); border-radius:18px; padding:28px 24px;
    box-shadow:0 20px 60px rgba(0,0,0,.6), 0 0 0 1px rgba(255,214,140,.06) inset;
    text-align:center;
  }
  .card-close{
    position:absolute; top:10px; right:12px; width:30px; height:30px; border-radius:50%;
    border:1px solid rgba(255,214,140,.25); background:rgba(255,255,255,.04); color:rgba(255,224,170,.85);
    font-size:18px; line-height:1; cursor:pointer;
  }
  /* 08.08.2026, Создатель: «нажимаю релиз — сразу 2 карточки: слева презентация, справа рабочий
     список» — одна модалка, две панели рядом (на узком экране сами переносятся друг под друга —
     презентация первой, как «слева» и есть по чтению).
     08.08.2026, распространено на ЛЮБУЮ карточку проекта/звезды (#card) — та же пара «Презентация
     | Процесс», просто под общей шапкой (фото/имя/роли), а не с самого верха модалки. */
  #releaseCardBodyWrap, #versionCardBodyWrap, #card .card-body{
    max-width:min(94vw, 820px);
  }
  #releaseCardBodyWrap, #versionCardBodyWrap{ display:flex; gap:22px; flex-wrap:wrap; text-align:left; }
  .card-panels{ display:flex; gap:22px; flex-wrap:wrap; text-align:left; margin-top:14px; }
  .panel{ flex:1 1 260px; min-width:220px; }
  .panel-title{
    margin:6px 0 12px; font-family:"Orbitron", sans-serif; font-weight:900;
    font-size:clamp(1rem,2.6vw,1.3rem); color:#fff6d6; letter-spacing:.02em; text-align:center;
  }
  .presentation-panel{
    border-right:1px solid rgba(255,214,140,.16); padding-right:22px;
  }
  @media (max-width: 640px){ .presentation-panel{ border-right:none; border-bottom:1px solid rgba(255,214,140,.16); padding-right:0; padding-bottom:18px; } }
  .presentation-item{
    margin:8px 0; font-family:Georgia, serif; font-size:13px; line-height:1.5; color:rgba(230,220,200,.92);
  }
  /* 07.08.2026, Андрей: «нажимаю версию — сразу вижу, о чём был прошлый разговор» — короткий якорь
     над списком сделанного, визуально отделён (курсив + нижняя рамка), не смешивается со списком. */
  .version-session-summary{
    margin:0 0 12px; padding-bottom:10px; border-bottom:1px dashed rgba(255,214,140,.22);
    font-family:Georgia, serif; font-style:italic; font-size:12px; line-height:1.5;
    color:rgba(255,214,140,.75);
  }
  .version-session-summary:empty{ display:none; }
  /* 07.08.2026: прямой вердикт готовности к релизу — не спрятан внутри списка пунктов, сразу видно. */
  .release-readiness{
    margin:0 0 14px; padding:10px 14px; border-radius:10px; font-family:"Cinzel", serif;
    font-size:13px; font-weight:600; line-height:1.5; text-align:center;
  }
  .release-readiness:empty{ display:none; }
  .release-readiness.ready{ background:rgba(62,207,106,.12); border:1px solid rgba(62,207,106,.35); color:#7be3a0; }
  .release-readiness.almost{ background:rgba(255,204,51,.1); border:1px solid rgba(255,204,51,.32); color:#ffd558; }
  .release-readiness.not-ready{ background:rgba(255,90,90,.1); border:1px solid rgba(255,90,90,.32); color:#ff9a9a; }
  .card-name{ margin:6px 0 12px; font-family:"Orbitron", sans-serif; font-weight:900; font-size:clamp(1.3rem,4vw,1.9rem);
    color:#fff6d6; letter-spacing:.02em; }
  .card-roles{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-bottom:10px; }
  .card-pill{
    font-family:"Cinzel", serif; font-size:11px; letter-spacing:.05em; text-transform:uppercase;
    color:#ffd558; background:rgba(255,213,88,.08); border:1px solid rgba(255,213,88,.22);
    border-radius:100px; padding:4px 12px;
  }
  .card-fact{ margin:6px 0; font-family:Georgia, serif; font-size:13px; color:rgba(230,220,200,.85); }
  /* 07.08.2026, Создатель: «нужно подумать сколько клипов, когда выходил последний, когда первый
     и прям в карточке отмечать красные кружочки которые показывают статус» — источник данных: сам
     Создатель смотрит в TikTok, поля заполняются вручную (см. data-projects.js/data-participants.js
     верхний комментарий). Пока поле не заполнено — блок просто не рисуется, никаких выдуманных цифр. */
  .card-stats{ margin-top:10px; padding-top:10px; border-top:1px solid rgba(255,214,140,.14); }
  .card-stat-line{ margin:4px 0; font-family:Georgia, serif; font-size:12px; color:rgba(230,220,200,.7);
    display:flex; align-items:center; justify-content:center; gap:6px; }
  .status-dot{ display:inline-block; width:9px; height:9px; border-radius:50%; flex:none; }
  .status-dot.green{ background:#3ecf6a; box-shadow:0 0 7px rgba(62,207,106,.7); }
  .status-dot.yellow{ background:#ffcc33; box-shadow:0 0 7px rgba(255,204,51,.7); }
  .status-dot.red{ background:#ff4444; box-shadow:0 0 7px rgba(255,68,68,.7); }
  /* 07.08.2026, Создатель: «где информации нет — красный кружок и вопросительный знак» — отдельный
     более крупный кружок с «?» внутри, для строк без данных (не путать с маленьким status-dot). */
  .status-dot.unknown{ width:15px; height:15px; background:#ff4444; color:#fff; font-family:Georgia, serif;
    font-size:10px; font-weight:700; line-height:15px; text-align:center; box-shadow:0 0 7px rgba(255,68,68,.7); }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <canvas id="tor" aria-hidden="true"></canvas>
    <img id="holePhoto" class="hole-photo" alt="" aria-hidden="true">
    <div class="word" role="button" tabindex="0" aria-label="BestOfficial — нажмите для Best">
      <span class="fo gold" id="foBase">BestOfficial</span>
      <span class="fo gold fo-over" id="foOver" aria-hidden="true"></span>
    </div>
  </div>
  <a id="tiktokLink" class="tiktok-link" href="https://www.tiktok.com/@best.show.official" target="_blank" rel="noopener noreferrer" aria-label="BestOfficial в TikTok">TikTok</a>
  <!-- 08.08.2026, Создатель: «прям под тор 2 кликабельные надписи — релиз 4, версия 1» — статус
       всего проекта целиком, не одного слова в цепочке, поэтому видно с самого начала. Релиз видят
       все — версия только локально (см. JS ниже), и версия растёт на каждое изменение файлов. -->
  <span id="releaseLabel" class="release-label" role="button" tabindex="0">Релиз 4.2</span>
  <span id="versionLabel" class="release-label" role="button" tabindex="0">Версия 2</span>
  <!-- 08.08.2026, Создатель: «нажимаю на релиз — сразу 2 карточки: слева презентация (аккуратно,
       что уже точно сделано), справа рабочий список (сюда буду добавлять/менять)». -->
  <div id="releaseCard" class="card" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="card-backdrop"></div>
    <div class="card-body" id="releaseCardBodyWrap">
      <button class="card-close" type="button" aria-label="Закрыть">×</button>
      <div class="panel presentation-panel">
        <h2 class="panel-title">🎬 Презентация</h2>
        <div id="presentationBody"></div>
      </div>
      <div class="panel working-panel">
        <h2 id="releaseCardTitle" class="panel-title"></h2>
        <!-- 07.08.2026, Андрей: «заполни карточку Релиз, там честно ответь — готовы к Релизу 5?» —
             прямой вердикт сверху списка, не спрятан внутри пунктов. -->
        <div id="releaseReadiness" class="release-readiness"></div>
        <div id="releaseCardBody"></div>
      </div>
    </div>
  </div>
  <!-- 08.08.2026, Создатель: «версия — своя карточка, которую хочу видеть только я, слева что уже
       сделано и точно работает, справа что в процессе» — та же пара Презентация/Процесс, но про
       сам локальный порт (техническая сторона), не про сообщество Best — и видна только локально. -->
  <div id="versionCard" class="card" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="card-backdrop"></div>
    <div class="card-body" id="versionCardBodyWrap">
      <button class="card-close" type="button" aria-label="Закрыть">×</button>
      <div class="panel presentation-panel">
        <h2 class="panel-title">🎬 Презентация</h2>
        <!-- 07.08.2026, Андрей: «нажимаю на версию — сразу вижу, о чём был прошлый разговор, что
             сделано после него, что нужно уточнить, что вообще не сделано — полная картина». Эта
             строка — короткий якорь «о чём был разговор», над списком сделанного. -->
        <div id="versionSessionSummary" class="version-session-summary"></div>
        <div id="versionPresentationBody"></div>
      </div>
      <div class="panel working-panel">
        <h2 id="versionCardTitle" class="panel-title"></h2>
        <div id="versionCardBody"></div>
      </div>
    </div>
  </div>
  <div id="navLeft" class="nav-btn nav-btn-left" role="button" tabindex="0" aria-label="Звёзды — участники Best">
    <canvas class="nav-canvas" aria-hidden="true"></canvas>
    <span class="nav-label" aria-hidden="true">Звёзды</span>
  </div>
  <div id="navRight" class="nav-btn nav-btn-right" role="button" tabindex="0" aria-label="Best — на главную">
    <canvas class="nav-canvas" aria-hidden="true"></canvas>
    <span class="nav-label" aria-hidden="true">Best</span>
  </div>
  <!-- 06.08.2026, Создатель: «лунору новый круг сверху слева, сделай мк тор» — третий mktor, прямой
       вход в Lunora из любого места (не часть линейной цепочки LEFT/RIGHT). -->
  <div id="navLunora" class="nav-btn nav-btn-top-left" role="button" tabindex="0" aria-label="Lunora">
    <canvas class="nav-canvas" aria-hidden="true"></canvas>
    <span class="nav-label" aria-hidden="true">Lunora</span>
  </div>
  <!-- 08.08.2026, Создатель: «везде где я открою карточку — про этот проект или звезду хочу видеть
       слева то, как это должно быть (эталон, что уже сделано и что вау), справа то, что происходит,
       чтобы презентация выглядела насыщеннее». Та же логика «Презентация | Процесс», что у Релиза,
       но теперь на любой карточке проекта/звезды. -->
  <div id="card" class="card" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="card-backdrop"></div>
    <div class="card-body">
      <button class="card-close" type="button" aria-label="Закрыть">×</button>
      <!-- 08.08.2026, Создатель: «в medium-тор проектов вставь название — Best и так же все
           проекты». У звезды в центре фото, у проекта фото нет — значит слово ложится прямо на
           тор, тем же приёмом, что и главное слово на главном Кторе. -->
      <div id="cardPhotoWrap" class="card-photo-wrap" style="display:none">
        <canvas id="cardMiniTorus" class="card-mini-torus" aria-hidden="true"></canvas>
        <img id="cardPhoto" class="card-photo" alt="">
        <span id="cardMiniTorusLabel" class="card-mini-torus-label" aria-hidden="true"></span>
      </div>
      <h2 id="cardName" class="card-name"></h2>
      <div id="cardRoles" class="card-roles"></div>
      <div class="card-panels">
        <div class="panel presentation-panel">
          <h3 class="panel-title">🎬 Презентация</h3>
          <div id="cardFacts" class="card-facts"></div>
        </div>
        <div class="panel working-panel">
          <h3 class="panel-title">⚙️ Процесс</h3>
          <div id="cardStats" class="card-stats"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/data-worlds.js"></script>

  <script src="js/best-app.js"></script>

<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BestOfficial</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/brand-word.css">
<link rel="stylesheet" href="css/stage.css">
<link rel="stylesheet" href="css/participants.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="stage">
    <canvas id="torCanvas" aria-hidden="true"></canvas>
    <h1 data-text="BestOfficial" role="button" tabindex="0" aria-label="BestOfficial. Нажмите, чтобы изменить цвет свечения">BestOfficial</h1>
    <img id="participantPhoto" class="participant-photo" alt="" aria-hidden="true">
    <div id="wordFlash" class="word-flash" aria-hidden="true"></div>
    <div id="lightStreak" class="light-streak" aria-hidden="true"></div>
  </div>
  <div class="meta-row">
    <span id="participantBadge" class="participant-badge" aria-hidden="true"></span>
    <span id="participantName" class="participant-name"></span>
  </div>
  <a id="tiktokLink" class="tiktok-link" href="https://www.tiktok.com/@best.show.official" target="_blank" rel="noopener noreferrer" aria-label="BestOfficial в TikTok — @best.show.official">TikTok</a>
  <div id="fom2Tor" class="fom2-wrap fom2-wrap-left" role="button" tabindex="0" aria-pressed="false" aria-label="Звёзды — сияние семьи BestOfficial">
    <canvas id="fom2Canvas" class="fom2-canvas" aria-hidden="true"></canvas>
    <span id="fom2Label" class="fom2-label" aria-hidden="true">Звёзды</span>
  </div>
  <div id="fom2TorRight" class="fom2-wrap fom2-wrap-right" role="button" tabindex="0" aria-label="Best — вернуться на главную страницу">
    <canvas id="fom2CanvasRight" class="fom2-canvas" aria-hidden="true"></canvas>
    <span class="fom2-label" aria-hidden="true">Best</span>
  </div>
  <div id="participantsPanel" class="participants-panel" role="dialog" aria-modal="true" aria-labelledby="participantsTitle" aria-hidden="true">
    <div class="participants-backdrop" data-close></div>
    <div class="participants-card">
      <button class="participants-close" type="button" aria-label="Закрыть">×</button>
      <p class="participants-eyebrow">TikTok · Telegram</p>
      <h2 id="participantsTitle">Звёзды</h2>
      <p class="participants-sub">@best.show.official · 397 подписчиков · 9&nbsp;018 лайков · 25 в Telegram · 121 видео</p>
      <div class="participants-grid" id="participantsGrid"></div>
      <p class="participants-foot">Клик по @нику открывает TikTok</p>
    </div>
  </div>
  <div id="starPage" class="star-page" role="dialog" aria-modal="true" aria-labelledby="starPageName" aria-hidden="true">
    <div class="star-backdrop" data-star-close></div>
    <div class="star-head">
      <img id="starPhoto" class="star-photo-mini" alt="">
      <div class="star-head-text">
        <h2 id="starPageName" class="star-name-mini"></h2>
        <div id="starRole" class="star-roles"></div>
      </div>
    </div>
    <div class="star-card">
      <div id="starFacts" class="star-facts"></div>
    </div>
  </div>

  <script src="js/data-worlds.js"></script>
  <script src="js/data-projects.js"></script>
  <script src="js/data-participants.js"></script>
  <script src="js/word-fx.js"></script>
  <script src="js/torus.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
